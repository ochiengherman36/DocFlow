[project]
name = "backend"
version = "0.1.0"
description = "DocFlow is an app that turns supplier invoice PDFs, digital or scanned, into checked data. A person reviews it, and the approved result goes to Zoho Books through OAuth2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
